# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s/migrations

# template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
sourceless = false

# version location specification
# Core migrations + all module branches.
# Listed one per line (path_separator = newline for cross-platform portability).
# env.py _build_version_locations() also computes this at runtime (including
# externally-installed plugin modules from the "aiutox.modules" entry point
# group) and injects it into the live ScriptDirectory, so commands that run
# env.py (upgrade, downgrade, current, stamp...) see every branch without
# listing plugin paths here. Commands that do NOT run env.py (heads, history)
# only see the paths listed below.
version_locations =
    migrations/versions
    app/modules/billing/migrations/versions
    app/modules/crm/migrations/versions
    app/modules/data_collection/migrations/versions
    app/modules/finances/migrations/versions
    app/modules/inventory/migrations/versions
    app/modules/real_estate/migrations/versions
    app/core/tasks/migrations/versions

# path_separator = newline: cross-platform (no Windows drive-letter conflicts with ':')
path_separator = newline

# set to 'true' to search source files recursively
# This allows Alembic to discover nested migration files
recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# database URL. This is consumed by the user-maintained env.py script only.
# other means of configuring database URLs may be customized within the env.py
# file.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

